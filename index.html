<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEL — QR Asset Scanner</title>
<script>
  // ===========================================================================
  //  Bootstrap job identity - the ONE thing to edit when reusing this file as
  //  the seed for a brand-new device with no existing data (a different site,
  //  register, client). Once a device has used this page, jobs are added and
  //  switched entirely from the in-app "+ Job" control (see JOB_ID_RE and
  //  switchJob() further down) - these two lines only matter for what a
  //  fresh device's first job is called, and as the id any pre-multi-job
  //  data on a returning device is found under (see migrateLegacySingleJob()
  //  further down). Also update <title> above.
  //
  //  Defined here, in a tiny script at the very top of <head> rather than in
  //  the main script at the bottom of <body>, purely so a returning
  //  visitor's saved dark/light preference (global, not per-job - see
  //  GLOBAL_KEYS further down) can be applied to <html> BEFORE the page
  //  paints - otherwise every reload would flash the light theme first, then
  //  flip to dark a moment later.
  // ===========================================================================
  window.JOB_ID = "NEL";
  window.JOB_LABEL = "NEL Tunnel — Mechanical";
  (function () {
    try {
      // Global key first; falls back to the old per-(bootstrap-)job key so a
      // device that saved "dark" before this version's one-time migration
      // has run doesn't flash light once on the very next load.
      var raw = localStorage.getItem("qrtrack.theme.v1");
      if (raw === null) raw = localStorage.getItem("qrtrack." + window.JOB_ID + ".theme.v1");
      if (raw && JSON.parse(raw) === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    } catch (e) { /* localStorage unavailable - defaults to light, matches the rest of the app's fail-open behavior */ }
  })();
</script>
<style>
  :root {
    --delivery-color: #b8860b;
    --delivery-bg: #fff6df;
    --install-color: #1e7d32;
    --install-bg: #e9f7ec;
    --ink: #14181c;
    --paper: #ffffff;
    --border: #c9cfd6;
    --danger: #b3261e;
    --danger-bg: #fdecea;
    --surface: #ffffff;
    --surface-alt: #eeeeee;
    --text-muted: #555555;
    --text-faint: #777777;
    --scan-row-bg: #f7f7f7;
    --scan-row-border: #999999;
    --shadow: rgba(0, 0, 0, 0.3);
    --focus-ring: #2f6fed;
    color-scheme: light;
  }
  /* Dark palette: not a dimmed/compromise mode - tuned to hold the same
     field-legibility bar as light mode (bright daylight to low light), just
     inverted. Never auto-follows prefers-color-scheme - the theme toggle is
     an explicit, remembered choice that defaults to light on a fresh device
     (see the <head> script above and applyTheme() below). */
  :root[data-theme="dark"] {
    --delivery-color: #e2a53a;
    --delivery-bg: #3a2f12;
    --install-color: #52b975;
    --install-bg: #163521;
    --ink: #eef2f5;
    --paper: #14181c;
    --border: #3a4149;
    --danger: #ff7a6e;
    --danger-bg: #3a1a16;
    --surface: #1c2127;
    --surface-alt: #262c33;
    --text-muted: #b7c0c8;
    --text-faint: #8d97a0;
    --scan-row-bg: #1d2329;
    --scan-row-border: #55606a;
    --shadow: rgba(0, 0, 0, 0.6);
    --focus-ring: #7ab8ff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--paper); color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex; flex-direction: column; min-height: 100dvh;
    transition: background-color 150ms ease, color 150ms ease;
  }
  *:focus-visible {
    outline: 3px solid var(--focus-ring); outline-offset: 2px;
  }

  /* ---- Banners (storage-not-persisting warning, first-run hint) ---- */
  .banner {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 12px; font-size: 13px; font-weight: 600; line-height: 1.3;
  }
  .banner[hidden] { display: none; }
  .banner-warn { background: var(--danger-bg); color: var(--danger); border-bottom: 2px solid var(--danger); }
  .banner-info { background: var(--surface-alt); color: var(--ink); border-bottom: 2px solid var(--border); }
  .banner button {
    background: none; border: none; font-size: 18px; line-height: 1; cursor: pointer;
    color: inherit; padding: 0 4px; flex-shrink: 0;
  }

  /* ---- Top bar: job selector + mode toggle + register/device status ---- */
  #topbar {
    padding: 10px 12px 8px;
    border-bottom: 3px solid var(--border);
    transition: background-color 120ms ease;
  }
  body.mode-delivery #topbar { background: var(--delivery-bg); }
  body.mode-install  #topbar { background: var(--install-bg); }

  #jobRow {
    display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
  }
  #jobSelect {
    flex: 1; min-width: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase;
    padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text-muted);
  }
  #addJobBtn {
    font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap;
  }

  #modeToggle {
    display: flex; gap: 8px;
  }
  .mode-btn {
    flex: 1; padding: 14px 6px; font-size: 18px; font-weight: 700;
    border: 3px solid var(--border); border-radius: 10px; background: var(--surface);
    color: var(--text-muted); cursor: pointer;
  }
  .mode-btn.active[data-mode="DELIVERY"] {
    background: var(--delivery-color); color: #fff; border-color: var(--delivery-color);
  }
  .mode-btn.active[data-mode="INSTALL"] {
    background: var(--install-color); color: #fff; border-color: var(--install-color);
  }

  #statusRow {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 8px; font-size: 12px; color: var(--text-muted); gap: 8px; flex-wrap: wrap;
  }
  #statusRow button {
    font-size: 12px; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface); color: var(--ink); cursor: pointer;
  }
  #helpBtn { font-weight: 700; }
  .pill {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    background: var(--surface-alt); font-weight: 600;
  }
  .pill.warn { background: var(--danger-bg); color: var(--danger); }

  /* ---- Camera ---- */
  #cameraWrap {
    position: relative; width: 100%; aspect-ratio: 3 / 4; max-height: 46vh;
    background: #000; overflow: hidden; flex-shrink: 0;
  }
  #video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #cameraOverlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; gap: 10px;
    align-items: center; justify-content: center;
    color: #fff; background: rgba(0,0,0,0.55); text-align: center; padding: 16px; font-size: 14px;
  }
  #cameraOverlay.hidden { display: none; }
  /* Always theme-independent (bg is a fixed dark camera backdrop regardless
     of the page's light/dark setting) - a light button on it stays legible
     either way, rather than borrowing --ink/--surface which flip meaning
     between themes and would sometimes render dark-on-dark. */
  .overlay-btn {
    padding: 10px 18px; font-size: 15px; font-weight: 700; border-radius: 8px; border: none; cursor: pointer;
    background: #ffffff; color: #14181c;
  }
  .overlay-btn:active { opacity: 0.85; }
  #scanFrame {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    border: 3px solid rgba(255,255,255,0.85); border-radius: 12px;
    pointer-events: none;
    /* width/height are set in JS - see sizeScanFrame() for why they can't be CSS. */
  }
  #flashHit {
    position: absolute; inset: 0; background: rgba(60, 200, 90, 0.35); opacity: 0; pointer-events: none;
    transition: opacity 120ms ease;
  }

  /* ---- Scan list ---- */
  #listWrap { flex: 1; overflow-y: auto; padding: 8px 10px 90px; }
  #listHeader {
    display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 10px;
    margin: 6px 2px;
  }
  #listHeader h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); margin: 0;
  }
  #listSubtext { font-size: 12px; color: var(--text-faint); flex: 1 1 auto; }
  #clearLogBtn {
    font-size: 12px; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface); color: var(--ink); cursor: pointer;
  }
  #clearLogBtn:disabled { opacity: 0.5; cursor: not-allowed; }
  .scan-row {
    display: flex; align-items: baseline; gap: 8px; padding: 10px 10px; margin-bottom: 6px;
    border-radius: 8px; border-left: 6px solid var(--scan-row-border); background: var(--scan-row-bg); font-size: 15px;
  }
  .scan-row.action-DELIVERED { border-left-color: var(--delivery-color); background: var(--delivery-bg); }
  .scan-row.action-INSTALLED { border-left-color: var(--install-color); background: var(--install-bg); }
  .scan-row .tag { font-weight: 700; font-family: ui-monospace, Consolas, monospace; }
  .scan-row .act { font-weight: 600; color: var(--text-muted); }
  .scan-row .time { margin-left: auto; color: var(--text-faint); font-variant-numeric: tabular-nums; font-size: 13px; }
  .scan-row .flag { font-size: 11px; padding: 1px 6px; border-radius: 6px; background: var(--danger-bg); color: var(--danger); font-weight: 700; }
  #emptyMsg { color: var(--text-faint); padding: 24px 10px; text-align: center; font-size: 14px; }

  /* ---- Bottom bar ---- */
  #bottombar {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: var(--paper); border-top: 3px solid var(--border);
  }
  #scanCount { font-weight: 700; font-size: 15px; }
  #scanCount small { display: block; font-weight: 400; color: var(--text-muted); font-size: 11px; }
  #exportGroup { margin-left: auto; display: flex; gap: 8px; }
  #shareBtn {
    padding: 14px 16px; font-size: 15px; font-weight: 700;
    border-radius: 10px; border: 2px solid var(--ink); background: var(--surface); color: var(--ink); cursor: pointer;
  }
  #shareBtn[hidden] { display: none; }
  #shareBtn:active { opacity: 0.8; }
  #exportBtn {
    padding: 14px 20px; font-size: 16px; font-weight: 700;
    border-radius: 10px; border: none; background: var(--ink); color: var(--paper); cursor: pointer;
  }
  #exportBtn:active { opacity: 0.8; }

  /* ---- Toast (export confirmation) ---- */
  .toast {
    position: fixed; left: 50%; bottom: calc(78px + env(safe-area-inset-bottom));
    transform: translateX(-50%); max-width: calc(100% - 32px);
    background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px;
    font-size: 13px; font-weight: 600; text-align: center;
    box-shadow: 0 6px 20px var(--shadow); z-index: 60;
    opacity: 0; transition: opacity 200ms ease;
  }
  .toast[hidden] { display: none; }
  .toast.show { opacity: 1; }

  /* ---- Modal ---- */
  #modalRoot {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50;
  }
  #modalRoot[hidden] { display: none; }
  .modal-card {
    background: var(--surface); color: var(--ink); border-radius: 14px; padding: 20px; max-width: 380px; width: 100%;
    max-height: 80vh; overflow-y: auto;
    box-shadow: 0 10px 40px var(--shadow);
  }
  .modal-card h3 { margin: 0 0 8px; font-size: 18px; }
  .modal-card p { margin: 0 0 16px; font-size: 15px; color: var(--ink); line-height: 1.4; }
  .modal-card input[type="text"] {
    width: 100%; padding: 12px; font-size: 16px; border: 2px solid var(--border);
    border-radius: 8px; margin-bottom: 14px; background: var(--paper); color: var(--ink);
  }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
  .modal-actions button {
    padding: 12px 18px; font-size: 15px; font-weight: 700; border-radius: 8px; border: none; cursor: pointer;
  }
  .modal-actions button:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary { background: var(--surface-alt); color: var(--ink); }
  .btn-primary { background: var(--ink); color: var(--paper); }
  .btn-danger { background: #b3261e; color: #fff; }

  a.linklike { color: var(--ink); text-decoration: underline; cursor: pointer; background: none; border: none; font: inherit; padding: 0; }
</style>

  <div id="modalRoot" hidden>
    <div class="modal-card" id="modalCard" role="dialog" aria-modal="true"></div>
  </div>

<!-- Vendored locally (no CDN) so the page keeps working offline once cached. -->
<script src="jsQR.js"></script>
<script>
(function () {
  "use strict";

  // ===========================================================================
  //  Job identity - a device can now hold multiple jobs (site/register/scan-
  //  log sets) side by side and switch between them from the header, instead
  //  of needing a whole separate deployed copy of this folder per job (the
  //  old model - see DEPLOY.md if you're still doing that for a genuinely
  //  separate client/origin). BOOTSTRAP_JOB_ID/LABEL are only the starting
  //  job a fresh device sees, and the id any pre-multi-job data is migrated
  //  under unchanged (see migrateLegacySingleJob() below) - nothing else in
  //  this file reads them directly; everything else goes through whichever
  //  job is currently active (`activeJobId` / `JK` below).
  // ===========================================================================
  const BOOTSTRAP_JOB_ID = window.JOB_ID;
  const BOOTSTRAP_JOB_LABEL = window.JOB_LABEL;

  // Same charset the desktop GUI's own multi-job feature validates a job id
  // against (it becomes a `jobs/<id>/` folder name there) - kept identical
  // so a web-side job id stays safe to reuse as a desktop job id later, and
  // vice versa: starts with a letter/number, then letters/numbers/-/_, up to
  // 32 chars. Here it ends up as a localStorage-key segment and a CSV-
  // filename segment, so the restriction is about safety, not naming style.
  const JOB_ID_RE = /^[A-Za-z0-9][A-Za-z0-9_-]{0,31}$/;

  // ===========================================================================
  //  Storage helpers - every localStorage access is wrapped, per the brief.
  //  A private-browsing tab or a browser blocking site data must not crash
  //  the page; it just won't remember anything between reloads. persistOrWarn()
  //  additionally surfaces that failure to the user via a banner (previously
  //  this only reached the console, which nobody in the field ever sees).
  // ===========================================================================
  // Global: shared across every job on this device, not re-scoped on a job
  // switch - these describe the PHONE (which one it is, its UI preferences),
  // not the job, so there's exactly one of each regardless of how many jobs
  // exist.
  const GLOBAL_KEYS = {
    jobs: "qrtrack.jobList.v1",           // [{id, label}, ...]
    activeJob: "qrtrack.activeJobId.v1",
    device: "qrtrack.device.v1",
    speak: "qrtrack.speak.v1",
    theme: "qrtrack.theme.v1",
    onboarded: "qrtrack.onboarded.v1",
  };
  // Per-job: re-read/re-written on every switchJob() call below. Same shape
  // as the original single-job keys, just parameterized by whichever job id
  // is active instead of a hardcoded constant - so an existing device's data
  // under qrtrack.<BOOTSTRAP_JOB_ID>.* keeps working unmodified once that id
  // becomes (and stays) the first entry in the job list.
  function jobKeys(jobId) {
    return {
      register: `qrtrack.${jobId}.register.v1`,
      scans: `qrtrack.${jobId}.scanlog.v1`,
      mode: `qrtrack.${jobId}.mode.v1`,
    };
  }

  function lsGet(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch (e) {
      console.warn("localStorage read failed for", key, e);
      return fallback;
    }
  }
  function lsSet(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (e) {
      console.warn("localStorage write failed for", key, e);
      return false;
    }
  }
  function showPersistBanner() {
    const b = document.getElementById("persistBanner");
    if (b) b.hidden = false;
  }
  function persistOrWarn(key, value) {
    if (!lsSet(key, value)) showPersistBanner();
  }

  // One-time migration from the pre-multi-job version: device/speak/theme/
  // onboarded used to be per-job (qrtrack.<BOOTSTRAP_JOB_ID>.xxx.v1) simply
  // because there was only ever one job per deployed page. They're global
  // now, so pull any existing value forward into its new shared key - but
  // only if that key doesn't already exist, so this is a true no-op after
  // the first run. register/scanlog/mode need no equivalent step: they keep
  // the exact same qrtrack.<jobId>.xxx.v1 shape, just addressed through JK
  // (below) instead of a hardcoded constant.
  function migrateLegacySingleJob() {
    for (const [globalKey, suffix] of [
      [GLOBAL_KEYS.device, "device.v1"],
      [GLOBAL_KEYS.speak, "speak.v1"],
      [GLOBAL_KEYS.theme, "theme.v1"],
      [GLOBAL_KEYS.onboarded, "onboarded.v1"],
    ]) {
      try {
        if (localStorage.getItem(globalKey) !== null) continue;
        const legacyRaw = localStorage.getItem(`qrtrack.${BOOTSTRAP_JOB_ID}.${suffix}`);
        if (legacyRaw !== null) localStorage.setItem(globalKey, legacyRaw);
      } catch (e) { /* storage unavailable - nothing to migrate into anyway */ }
    }
  }

  // First run of the multi-job version (or a corrupt/cleared list): seed it
  // with this deployment's original single job, so existing data under
  // qrtrack.<BOOTSTRAP_JOB_ID>.* is picked straight up with zero migration.
  function loadJobList() {
    const stored = lsGet(GLOBAL_KEYS.jobs, null);
    if (Array.isArray(stored) && stored.length) return stored;
    const seeded = [{ id: BOOTSTRAP_JOB_ID, label: BOOTSTRAP_JOB_LABEL }];
    persistOrWarn(GLOBAL_KEYS.jobs, seeded);
    return seeded;
  }

  function buildRegisterIndex(items) {
    // First-match-wins, same semantics as the old Array.find() version, but
    // O(1) per lookup instead of O(n) - matters once a register or scan log
    // grows into the thousands over a multi-week job. Also counts duplicate
    // TagIDs so callers can surface that instead of it being console-only.
    const idx = new Map();
    let duplicates = 0;
    for (const r of items) {
      if (idx.has(r.TagID)) {
        duplicates++;
        console.warn(`Register CSV has a duplicate TagID '${r.TagID}' - only the first row for it will ever be matched.`);
        continue;
      }
      idx.set(r.TagID, r);
    }
    return { idx, duplicates };
  }

  function scanKey(tagId, action) { return tagId + "|" + action; }

  function buildScanIndex(log) {
    // scanLog is newest-first (unshift). Iterate in that order and keep only
    // the first (= newest) entry per TagID+action key, matching what the old
    // scanLog.find(...) returned.
    const idx = new Map();
    for (const s of log) {
      const key = scanKey(s.TagID, s.action);
      if (!idx.has(key)) idx.set(key, s);
    }
    return idx;
  }

  // ===========================================================================
  //  State
  // ===========================================================================
  migrateLegacySingleJob();
  let jobs = loadJobList();                           // [{id, label}, ...], display order
  let activeJobId = lsGet(GLOBAL_KEYS.activeJob, null);
  if (!activeJobId || !jobs.some((j) => j.id === activeJobId)) {
    activeJobId = jobs[0].id;
    persistOrWarn(GLOBAL_KEYS.activeJob, activeJobId);
  }
  let JK = jobKeys(activeJobId);                       // this job's register/scans/mode keys

  let register = lsGet(JK.register, null);            // { items: [...], loadedAt } or null
  // Array.isArray guard, not just a truthiness check on `register`: this runs at
  // module init, so a stored value from an older/corrupt shape would otherwise
  // throw here and brick the whole page on every reload, with no way to recover
  // from a phone. Falling back to "no register" just means tags aren't flagged.
  let registerIndex = register && Array.isArray(register.items)
    ? buildRegisterIndex(register.items).idx                                    // TagID -> row
    : null;
  let deviceName = lsGet(GLOBAL_KEYS.device, null);    // string or null - shared across every job
  let scanLog = lsGet(JK.scans, []);                   // [{TagID, timestamp, action, device}], newest first
  let scanIndex = buildScanIndex(scanLog);             // "TagID|ACTION" -> newest matching entry
  let speakEnabled = lsGet(GLOBAL_KEYS.speak, false);
  let mode = "DELIVERY";                              // default for a first-ever visit; see the mode-resume
                                                        // prompt in Init below for returning-visitor behavior
  let exportedThisSession = false;                    // gates Clear log - see clearLogBtn wiring
  const lastSeenAt = new Map();                        // TagID -> ms timestamp, for the 3s debounce
  const DEBOUNCE_MS = 3000;

  // ===========================================================================
  //  Melbourne-local ISO8601 timestamp (handles AEST/AEDT automatically by
  //  comparing how the same instant renders in Melbourne vs UTC, rather than
  //  hardcoding a fixed +10:00).
  // ===========================================================================
  function melbourneIso(date) {
    date = date || new Date();
    const parts = new Intl.DateTimeFormat("en-CA", {
      timeZone: "Australia/Melbourne",
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false,
    }).formatToParts(date).reduce((acc, p) => { acc[p.type] = p.value; return acc; }, {});

    const localAsUtc = Date.UTC(
      Number(parts.year), Number(parts.month) - 1, Number(parts.day),
      Number(parts.hour), Number(parts.minute), Number(parts.second)
    );
    const offsetMinutes = Math.round((localAsUtc - date.getTime()) / 60000);
    const sign = offsetMinutes >= 0 ? "+" : "-";
    const abs = Math.abs(offsetMinutes);
    const offH = String(Math.floor(abs / 60)).padStart(2, "0");
    const offM = String(abs % 60).padStart(2, "0");

    return `${parts.year}-${parts.month}-${parts.day}T${parts.hour}:${parts.minute}:${parts.second}${sign}${offH}:${offM}`;
  }
  function melbourneDateOnly(date) {
    return new Intl.DateTimeFormat("en-CA", { timeZone: "Australia/Melbourne" }).format(date || new Date());
  }
  // Time-only, for on-screen display. Deliberately Melbourne-local like the
  // export data (melbourneIso() above) rather than the device's own local
  // time - on a phone whose clock/timezone isn't set to Melbourne, those two
  // used to disagree with what actually ends up in the exported CSV.
  // The formatter is built once, not per call: renderScanList() formats up to
  // 200 rows on every single scan, and constructing an Intl.DateTimeFormat is
  // by far the most expensive part of that loop.
  const MELBOURNE_TIME_FMT = new Intl.DateTimeFormat("en-AU", {
    timeZone: "Australia/Melbourne", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false,
  });
  function melbourneTimeOnly(date) {
    return MELBOURNE_TIME_FMT.format(date);
  }

  // ===========================================================================
  //  Modal system (custom, not native alert/confirm/prompt - those block the
  //  whole page/tab and don't fit the site-glove-friendly styling).
  // ===========================================================================
  const modalRoot = document.getElementById("modalRoot");
  const modalCard = document.getElementById("modalCard");
  let onModalEscape = null;   // set by whichever modal is currently open, so Escape does the same thing as its Cancel

  function closeModal() { modalRoot.hidden = true; modalCard.innerHTML = ""; onModalEscape = null; }

  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && !modalRoot.hidden && onModalEscape) onModalEscape();
  });

  function showConfirm({ title, message, confirmLabel, cancelLabel, danger }) {
    return new Promise((resolve) => {
      modalCard.innerHTML = `
        <h3>${escapeHtml(title)}</h3>
        <p>${escapeHtml(message)}</p>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="modalCancel">${escapeHtml(cancelLabel || "Cancel")}</button>
          <button type="button" class="${danger ? "btn-danger" : "btn-primary"}" id="modalConfirm">${escapeHtml(confirmLabel || "OK")}</button>
        </div>`;
      modalRoot.hidden = false;
      const cancel = () => { closeModal(); resolve(false); };
      document.getElementById("modalCancel").onclick = cancel;
      document.getElementById("modalConfirm").onclick = () => { closeModal(); resolve(true); };
      onModalEscape = cancel;
      document.getElementById("modalConfirm").focus();
    });
  }

  function showDeviceNamePrompt(existing) {
    return new Promise((resolve) => {
      modalCard.innerHTML = `
        <h3>Device name</h3>
        <p>Used to tag every scan with which phone/tablet made it (shown in the export filename).</p>
        <input type="text" id="deviceInput" placeholder="e.g. Jack-Phone" value="${escapeHtml(existing || "")}">
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="modalCancel">Cancel</button>
          <button type="button" class="btn-primary" id="modalConfirm">Save</button>
        </div>`;
      modalRoot.hidden = false;
      const input = document.getElementById("deviceInput");
      input.focus();
      const save = () => {
        const v = sanitizeDeviceName(input.value);
        closeModal();
        resolve(v || null);
      };
      const cancel = () => { closeModal(); resolve(null); };
      document.getElementById("modalCancel").onclick = cancel;
      document.getElementById("modalConfirm").onclick = save;
      input.addEventListener("keydown", (ev) => { if (ev.key === "Enter") save(); });
      onModalEscape = cancel;
    });
  }

  // Typed-word confirmation for destructive actions, matching this project's
  // own established "type YES" pattern for anything that can't be undone
  // (e.g. the desktop GUI's Reset workbook). Confirm stays disabled until the
  // typed text matches exactly.
  function showTypedConfirm({ title, message, confirmWord, confirmLabel, cancelLabel }) {
    return new Promise((resolve) => {
      modalCard.innerHTML = `
        <h3>${escapeHtml(title)}</h3>
        <p>${escapeHtml(message)}</p>
        <input type="text" id="typedInput" placeholder="Type ${escapeHtml(confirmWord)} to confirm" autocomplete="off" autocapitalize="characters">
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="modalCancel">${escapeHtml(cancelLabel || "Cancel")}</button>
          <button type="button" class="btn-danger" id="modalConfirm" disabled>${escapeHtml(confirmLabel || "Confirm")}</button>
        </div>`;
      modalRoot.hidden = false;
      const input = document.getElementById("typedInput");
      const confirmBtn = document.getElementById("modalConfirm");
      input.addEventListener("input", () => { confirmBtn.disabled = input.value !== confirmWord; });
      input.focus();
      const cancel = () => { closeModal(); resolve(false); };
      document.getElementById("modalCancel").onclick = cancel;
      confirmBtn.onclick = () => { if (input.value === confirmWord) { closeModal(); resolve(true); } };
      onModalEscape = cancel;
    });
  }

  // Static help/reference card - not a promise-driven flow like the others
  // above, just an informational modal with a single Close button. Doubles
  // as the answer to "what does this button do" for a first-time user, since
  // there's nowhere else in the deployed app to put that (docs/ lives in the
  // private pipeline repo, unreachable from a phone).
  function showHelp() {
    modalCard.innerHTML = `
      <h3>Quick guide</h3>
      <p><strong>Job selector</strong> (top) — switch which job's register and scan log you're working with, or tap <strong>+ Job</strong> to add a new one. Device name, theme, and Speak stay the same across every job - only the register and scan log switch.</p>
      <p><strong>DELIVERY / INSTALL</strong> — sets what a scan logs. Every tag scanned while a mode is active is logged with that action automatically, no extra tap needed.</p>
      <p><strong>Set device</strong> — names this phone so scans show which device made them (also shown in the exported filename).</p>
      <p><strong>Load register CSV</strong> — only needed if the asset list didn't load automatically. It's used to flag tags that aren't on the list, not to block scanning.</p>
      <p><strong>Register / Device</strong> pills — show whether the tag list and device name are ready.</p>
      <p><strong>Export CSV</strong> — downloads every scan recorded for the current job. Safe to export more than once - nothing is lost by re-exporting.</p>
      <p><strong>Share</strong> — where supported, sends the exported file straight to another app (Teams, email, etc.) instead of only downloading it.</p>
      <p><strong>Clear log</strong> — permanently deletes every scan for the current job. Only available after exporting at least once this session.</p>
      <p><strong>Dark / Light</strong> — switches the colour theme. Defaults to light.</p>
      <p>Using Binary Eye instead of this app? Its printed <strong>#MODE:</strong> marker codes do the same job as the DELIVERY/INSTALL buttons above — you only need one or the other, not both.</p>
      <div class="modal-actions">
        <button type="button" class="btn-primary" id="modalConfirm">Close</button>
      </div>`;
    modalRoot.hidden = false;
    const close = () => { closeModal(); markOnboarded(); };
    document.getElementById("modalConfirm").onclick = close;
    onModalEscape = close;
    document.getElementById("modalConfirm").focus();
  }

  // Job id validated live (Create stays disabled until it's both well-formed
  // and not already in use) rather than failing after the fact - this is the
  // one modal flow here that isn't a fixed-choice confirm/prompt.
  function showAddJobPrompt() {
    return new Promise((resolve) => {
      modalCard.innerHTML = `
        <h3>New job</h3>
        <p>Job ID: letters/numbers/-/_ only, starting with a letter or number, up to 32 characters. It's stamped into every exported filename, so keep it short - e.g. <strong>SITE2</strong>.</p>
        <input type="text" id="jobIdInput" placeholder="e.g. SITE2" autocomplete="off" autocapitalize="characters">
        <input type="text" id="jobLabelInput" placeholder="Display name (optional)">
        <p id="jobIdError" style="color:var(--danger); font-size:13px; margin:-8px 0 14px; display:none;"></p>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="modalCancel">Cancel</button>
          <button type="button" class="btn-primary" id="modalConfirm" disabled>Create</button>
        </div>`;
      modalRoot.hidden = false;
      const idInput = document.getElementById("jobIdInput");
      const labelInput = document.getElementById("jobLabelInput");
      const errEl = document.getElementById("jobIdError");
      const confirmBtn = document.getElementById("modalConfirm");

      function validate() {
        const id = idInput.value.trim();
        let msg = "";
        if (id && !JOB_ID_RE.test(id)) msg = "Letters, numbers, - and _ only, starting with a letter or number.";
        else if (id && jobs.some((j) => j.id.toLowerCase() === id.toLowerCase())) msg = "A job with this ID already exists.";
        errEl.textContent = msg;
        errEl.style.display = msg ? "block" : "none";
        confirmBtn.disabled = !id || !!msg;
      }
      idInput.addEventListener("input", validate);
      idInput.focus();

      const cancel = () => { closeModal(); resolve(null); };
      document.getElementById("modalCancel").onclick = cancel;
      confirmBtn.onclick = () => {
        const id = idInput.value.trim();
        if (!id || !JOB_ID_RE.test(id) || jobs.some((j) => j.id.toLowerCase() === id.toLowerCase())) return;
        const label = labelInput.value.trim() || id;
        closeModal();
        resolve({ id, label });
      };
      onModalEscape = cancel;
    });
  }

  // Device name is free text a person types, but it flows straight into a
  // filename (scans_<JOB>_<device>_<date>.csv) and merge_scans.py's job-
  // mismatch check assumes that's exactly 3 underscore-separated segments.
  // An underscore in the device name (or a character Windows won't allow in
  // a filename) would silently break both. Sanitize once, here, rather than
  // at every place deviceName gets used.
  const DEVICE_NAME_UNSAFE = /[_<>:"/\\|?*]/g;
  function sanitizeDeviceName(s) {
    return s.trim().replace(DEVICE_NAME_UNSAFE, "-").slice(0, 40);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  // ===========================================================================
  //  Onboarding: a single dismissible first-run banner (not a blocking
  //  walkthrough - that would fight the existing non-blocking camera-start
  //  pattern used for register auto-load/device prompt below). Dismissing it
  //  or opening Help both mark it seen so it never reappears on this device.
  // ===========================================================================
  function markOnboarded() {
    const b = document.getElementById("onboardBanner");
    if (b) b.hidden = true;
    persistOrWarn(GLOBAL_KEYS.onboarded, true);
  }

  // ===========================================================================
  //  Theme: defaults to light on a fresh device regardless of OS preference -
  //  this is a deliberate, remembered user choice, not an auto-detected one.
  //  (The FOUC-avoiding early read of this same key lives in the <head>
  //  script - this is the version wired to the toggle button + persistence.)
  // ===========================================================================
  let theme = lsGet(GLOBAL_KEYS.theme, "light");
  function applyTheme(t) {
    theme = t === "dark" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", theme);
    const btn = document.getElementById("themeToggleBtn");
    if (btn) btn.textContent = theme === "dark" ? "Light" : "Dark";
  }
  function toggleTheme() {
    applyTheme(theme === "dark" ? "light" : "dark");
    persistOrWarn(GLOBAL_KEYS.theme, theme);
  }

  // ===========================================================================
  //  Register (trial_items.csv) loading + lookup
  // ===========================================================================
  function parseCsv(text) {
    // Small, deliberate CSV parser (handles quoted fields with commas/quotes) -
    // no external dependency needed for a simple 5-column register file.
    const rows = [];
    let row = [], field = "", inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; } else { inQuotes = false; }
        } else { field += c; }
      } else if (c === '"') {
        inQuotes = true;
      } else if (c === ",") {
        row.push(field); field = "";
      } else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(field); field = "";
        if (row.some((f) => f !== "")) rows.push(row);
        row = [];
      } else {
        field += c;
      }
    }
    if (field !== "" || row.length) { row.push(field); rows.push(row); }
    if (!rows.length) return [];
    const headers = rows[0].map((h) => h.trim());
    return rows.slice(1).map((r) => {
      const obj = {};
      headers.forEach((h, idx) => { obj[h] = (r[idx] || "").trim(); });
      return obj;
    });
  }

  function loadRegisterFromCsvText(text) {
    const items = parseCsv(text).filter((r) => r.TagID);
    if (!items.length) throw new Error("No TagID rows found in that CSV.");
    // generate_qr_codes.py / create_trial_workbook.py both refuse a CSV with
    // duplicate TagIDs, but this auto-load path can also be fed a hand-
    // edited or different-job CSV directly - don't hard-fail here (that
    // would silently break the zero-tap auto-load for everything, not just
    // the duplicate). The caller decides whether/how to surface `duplicates`
    // (silent on the automatic first-load path, shown to the user on a
    // manual "Load register CSV").
    const { idx, duplicates } = buildRegisterIndex(items);
    register = { items, loadedAt: Date.now() };
    registerIndex = idx;
    persistOrWarn(JK.register, register);
    renderStatus();
    return { count: items.length, duplicates };
  }

  function findInRegister(tagId) {
    if (!registerIndex) return null;
    return registerIndex.get(tagId) || null;
  }

  // ===========================================================================
  //  Scan log
  // ===========================================================================
  function saveScanLog() { persistOrWarn(JK.scans, scanLog); }

  function alreadyLoggedSameAction(tagId, action) {
    return scanIndex.get(scanKey(tagId, action)) || null;
  }

  async function recordScan(tagId, action) {
    const entry = { TagID: tagId, timestamp: melbourneIso(), action, device: deviceName || "UNKNOWN_DEVICE" };
    scanLog.unshift(entry);
    scanIndex.set(scanKey(tagId, action), entry);   // this entry is always the newest for its key
    saveScanLog();
    renderScanList();
    renderCounts();
    return entry;
  }

  function clearScanLog() {
    scanLog = [];
    scanIndex.clear();
    saveScanLog();
    renderScanList();
    renderCounts();
  }

  // ===========================================================================
  //  Feedback: beep (WebAudio, no external file), vibration, optional speech
  // ===========================================================================
  let audioCtx = null;
  function beep(freq, ms) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      osc.connect(gain); gain.connect(audioCtx.destination);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      osc.start();
      osc.stop(audioCtx.currentTime + ms / 1000);
    } catch (e) { /* no audio available - not fatal */ }
  }
  function vibrate(pattern) {
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) { /* ignore */ }
  }
  function speak(text) {
    if (!speakEnabled) return;
    try {
      if (!window.speechSynthesis) return;
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 1.05;
      window.speechSynthesis.speak(u);
    } catch (e) { /* ignore */ }
  }
  function flashHit() {
    const el = document.getElementById("flashHit");
    el.style.opacity = "1";
    setTimeout(() => { el.style.opacity = "0"; }, 150);
  }

  // ===========================================================================
  //  Handling a decoded QR value
  // ===========================================================================
  let processing = false;

  async function handleDecodedTag(rawText) {
    const tagId = (rawText || "").trim();
    if (!tagId) return;

    // Check `processing` FIRST: while a confirm modal is open (waiting on the
    // user), every incoming decode - of this tag or any other - is ignored
    // outright, without touching the debounce clock. Otherwise a decode that
    // arrives mid-modal would still update lastSeenAt and silently push the
    // debounce window further out, so a deliberate re-scan right after the
    // user dismisses the modal could get swallowed with no feedback at all.
    // The same flag is set during the mode-resume prompt at startup and a job
    // switch, for the same reason.
    if (processing) return;

    const now = Date.now();
    const lastSeen = lastSeenAt.get(tagId);
    if (lastSeen && now - lastSeen < DEBOUNCE_MS) return;   // silent debounce, not a popup
    lastSeenAt.set(tagId, now);

    processing = true;
    try {
      const action = mode === "DELIVERY" ? "DELIVERED" : "INSTALLED";

      // Only prompt when a register is actually loaded to judge against - a
      // job with none (every freshly-created job, until someone loads a CSV)
      // can't tell "unknown" from "no data to check", so it shouldn't flag
      // every single scan. Matches the same distinction renderScanList()
      // already makes for the "not in register" list flag.
      const known = findInRegister(tagId);
      if (register && !known) {
        const proceed = await showConfirm({
          title: "Unknown tag",
          message: `"${tagId}" is not in the loaded register. Log it anyway? (It will show up in the exception report.)`,
          confirmLabel: "Log anyway",
          cancelLabel: "Discard",
          danger: true,
        });
        if (!proceed) return;
      }

      const dup = alreadyLoggedSameAction(tagId, action);
      if (dup) {
        const dupTime = melbourneTimeOnly(new Date(dup.timestamp));
        const proceed = await showConfirm({
          title: "Already scanned",
          message: `"${tagId}" was already logged as ${action} at ${dupTime} on this phone. This does not check other phones — if two people are scanning the same tags, check with the team.`,
          confirmLabel: "Log again",
          cancelLabel: "Skip",
        });
        if (!proceed) return;
      }

      await recordScan(tagId, action);
      flashHit();
      beep(action === "DELIVERED" ? 700 : 900, 120);
      vibrate(60);
      speak(`${tagId} ${action.toLowerCase()}`);
    } finally {
      processing = false;
    }
  }

  // ===========================================================================
  //  Camera + decode loop: native BarcodeDetector where available, jsQR fallback.
  //  jsQR is vendored locally (scan_page/jsQR.js) - no CDN at runtime.
  // ===========================================================================
  const video = document.getElementById("video");
  const overlay = document.getElementById("cameraOverlay");
  let decodeCanvas = null, decodeCtx = null;
  let barcodeDetector = null;
  let scanTimer = null;

  // All overlay writes go through this so a message can optionally include a
  // Retry button without every call site having to build that markup itself,
  // and so a later message always fully replaces an earlier one (button
  // included) rather than leaving stale content behind.
  function setOverlayMessage(message, opts) {
    opts = opts || {};
    overlay.innerHTML = "";
    const msgEl = document.createElement("div");
    msgEl.textContent = message;
    overlay.appendChild(msgEl);
    if (opts.retry) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "overlay-btn";
      btn.textContent = "Retry";
      btn.addEventListener("click", () => {
        setOverlayMessage("Starting camera…");
        startCamera();
      });
      overlay.appendChild(btn);
    }
    overlay.classList.remove("hidden");
  }

  async function setUpDetector() {
    if ("BarcodeDetector" in window) {
      try {
        const formats = await window.BarcodeDetector.getSupportedFormats();
        if (formats.includes("qr_code")) {
          barcodeDetector = new window.BarcodeDetector({ formats: ["qr_code"] });
          return "native BarcodeDetector";
        }
      } catch (e) { /* fall through to jsQR */ }
    }
    if (!window.jsQR) {
      setOverlayMessage("QR decoder failed to load (jsQR.js missing). Camera scanning unavailable.");
      return null;
    }
    return "jsQR fallback";
  }

  const jsQRDecode = window.jsQR && window.jsQR.default ? window.jsQR.default : window.jsQR;

  async function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setOverlayMessage("This browser has no camera API. Open this page over HTTPS (or localhost) in Chrome.");
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1280 }, height: { ideal: 960 },
          // Continuous autofocus is what actually dominates "why is this
          // slow" on a close-up printed label - phones default to a single
          // fixed focus that can sit soft for a second or more. This is an
          // "advanced" constraint (best-effort, per spec) so it's silently
          // ignored on browsers/cameras that don't support it rather than
          // failing getUserMedia.
          advanced: [{ focusMode: "continuous" }],
        },
        audio: false,
      });
      video.srcObject = stream;
      await video.play();
      overlay.classList.add("hidden");
      sizeScanFrame();
    } catch (e) {
      setOverlayMessage(
        "Camera access failed: " + (e && e.message ? e.message : e) +
        ". On a phone, this page must be served over HTTPS (or via the insecure-origin flag for testing).",
        { retry: true }
      );
      return;
    }

    decodeCanvas = document.createElement("canvas");
    decodeCtx = decodeCanvas.getContext("2d", { willReadFrequently: true });
    const which = await setUpDetector();
    if (which) scanLoop();
  }

  async function scanLoop() {
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      try {
        if (barcodeDetector) {
          const results = await barcodeDetector.detect(video);
          if (results.length) await handleDecodedTag(results[0].rawValue);
        } else if (jsQRDecode) {
          decodeCanvas.width = video.videoWidth;
          decodeCanvas.height = video.videoHeight;
          decodeCtx.drawImage(video, 0, 0, decodeCanvas.width, decodeCanvas.height);
          const imgData = decodeCtx.getImageData(0, 0, decodeCanvas.width, decodeCanvas.height);
          const result = jsQRDecode(imgData.data, imgData.width, imgData.height, { inversionAttempts: "dontInvert" });
          if (result && result.data) await handleDecodedTag(result.data);
        }
      } catch (e) { console.warn("decode error", e); }
    }
    scanTimer = setTimeout(scanLoop, 80);   // ~12 decode attempts/sec - was 180ms/~5.5 per sec, felt
                                             // slow to pick up a code; native BarcodeDetector is
                                             // hardware-decoded (negligible cost per attempt) and
                                             // jsQR on a single small frame is still comfortably
                                             // under 80ms on any phone this runs on, so this doesn't
                                             // meaningfully change battery/CPU load in practice.
  }

  // Keeps the on-screen "aim here" frame an actual square regardless of the
  // phone's screen shape. #cameraWrap isn't square (aspect-ratio 3/4, further
  // clamped by max-height: 46vh), so a CSS-only percentage inset can't
  // guarantee squareness - this measures the container's real rendered box
  // and sets an explicit pixel width/height instead. The camera overlay
  // covers the whole area during startup, so the brief pre-layout moment
  // this runs in is never actually visible.
  function sizeScanFrame() {
    const wrap = document.getElementById("cameraWrap");
    const frame = document.getElementById("scanFrame");
    if (!wrap || !frame) return;
    const rect = wrap.getBoundingClientRect();
    if (!rect.width || !rect.height) return;   // not laid out yet - the resize listener will retry
    const side = Math.round(0.76 * Math.min(rect.width, rect.height));
    frame.style.width = side + "px";
    frame.style.height = side + "px";
  }
  window.addEventListener("resize", sizeScanFrame);
  window.addEventListener("orientationchange", sizeScanFrame);

  // ===========================================================================
  //  Jobs: switching + the header selector
  // ===========================================================================
  function updateDocumentTitle() {
    const job = jobs.find((j) => j.id === activeJobId);
    document.title = (job ? job.label : activeJobId) + " — QR Asset Scanner";
  }

  function renderJobSelect() {
    const sel = document.getElementById("jobSelect");
    if (!sel) return;
    sel.innerHTML = jobs.map((j) =>
      `<option value="${escapeHtml(j.id)}"${j.id === activeJobId ? " selected" : ""}>${escapeHtml(j.label)}</option>`
    ).join("");
  }

  // Re-points every per-job piece of state (register, scan log + its index,
  // mode) at the new job's storage keys and re-renders. Device name/speak/
  // theme/onboarded are global (see GLOBAL_KEYS above) and are deliberately
  // untouched by a switch.
  function switchJob(jobId) {
    if (jobId === activeJobId || !jobs.some((j) => j.id === jobId)) return;
    activeJobId = jobId;
    JK = jobKeys(activeJobId);
    persistOrWarn(GLOBAL_KEYS.activeJob, activeJobId);

    register = lsGet(JK.register, null);
    registerIndex = register && Array.isArray(register.items) ? buildRegisterIndex(register.items).idx : null;
    scanLog = lsGet(JK.scans, []);
    scanIndex = buildScanIndex(scanLog);
    // Silent, unlike the startup resume-confirm prompt below: switching jobs
    // is already a deliberate action, and the mode toggle's colour makes the
    // newly-active job's mode immediately visible - a second confirmation on
    // top of that would just be nagging.
    setMode(lsGet(JK.mode, "DELIVERY"));

    exportedThisSession = false;   // Clear log's gate doesn't carry across a switch
    setClearLogEnabled(false);
    lastSeenAt.clear();            // a tag debounced under the old job shouldn't suppress it under the new one

    renderJobSelect();
    renderStatus();
    renderCounts();
    renderScanList();
    updateDocumentTitle();
  }

  // ===========================================================================
  //  Rendering
  // ===========================================================================
  function renderStatus() {
    const pill = document.getElementById("registerPill");
    if (register && register.items.length) {
      pill.textContent = `${register.items.length} items`;
      pill.classList.remove("warn");
    } else {
      pill.textContent = "none loaded";
      pill.classList.add("warn");
    }
    const dpill = document.getElementById("devicePill");
    if (deviceName) { dpill.textContent = deviceName; dpill.classList.remove("warn"); }
    else { dpill.textContent = "not set"; dpill.classList.add("warn"); }
  }

  function renderListSubtext() {
    const el = document.getElementById("listSubtext");
    if (!el) return;
    if (!scanLog.length) { el.textContent = ""; return; }
    const oldest = scanLog[scanLog.length - 1];   // newest-first array, so the last entry is the oldest
    const since = (oldest.timestamp || "").slice(0, 10);
    el.textContent = `${scanLog.length} total, since ${since}`;
  }

  function renderCounts() {
    document.getElementById("scanCountMain").textContent = `${scanLog.length} scans`;
    const today = melbourneDateOnly();
    const todayCount = scanLog.filter((s) => (s.timestamp || "").slice(0, 10) === today).length;
    document.getElementById("scanCountToday").textContent = `${todayCount} today`;
    renderListSubtext();
  }

  function renderScanList() {
    const listEl = document.getElementById("scanList");
    const emptyEl = document.getElementById("emptyMsg");
    if (!scanLog.length) { listEl.innerHTML = ""; emptyEl.style.display = "block"; return; }
    emptyEl.style.display = "none";
    listEl.innerHTML = scanLog.slice(0, 200).map((s) => {
      const time = melbourneTimeOnly(new Date(s.timestamp));
      const unknown = register && !findInRegister(s.TagID);
      return `<div class="scan-row action-${escapeHtml(s.action)}">
        <span class="tag">${escapeHtml(s.TagID)}</span>
        <span class="act">${escapeHtml(s.action)}</span>
        ${unknown ? '<span class="flag">not in register</span>' : ""}
        <span class="time">${escapeHtml(time)}</span>
      </div>`;
    }).join("");
  }

  // Both timers are tracked and cleared: without clearing the inner one, a
  // second toast raised during the previous toast's 220ms fade-out would be
  // hidden again by that stale timeout the moment it appeared.
  let toastFadeTimer = null;
  let toastHideTimer = null;
  function showToast(message) {
    const el = document.getElementById("toast");
    clearTimeout(toastFadeTimer);
    clearTimeout(toastHideTimer);
    el.textContent = message;
    el.hidden = false;
    requestAnimationFrame(() => el.classList.add("show"));
    toastFadeTimer = setTimeout(() => {
      el.classList.remove("show");
      toastHideTimer = setTimeout(() => { el.hidden = true; }, 220);
    }, 2600);
  }

  // ===========================================================================
  //  CSV export - dumps the full local scan log every time (append-only event
  //  log semantics: merge_scans.py's earliest-wins logic makes re-exports and
  //  overlapping exports safe, so this never risks silently dropping a day's
  //  scans if someone forgets to export daily). Shared by both the download
  //  button and the Share button below.
  // ===========================================================================
  function scansToCsv(rows) {
    const header = "TagID,timestamp,action,device";
    const lines = rows.map((r) => [r.TagID, r.timestamp, r.action, r.device]
      .map((v) => {
        v = String(v == null ? "" : v);
        return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
      }).join(","));
    return [header].concat(lines).join("\r\n") + "\r\n";
  }

  async function ensureReadyToExport() {
    if (!deviceName) {
      const name = await showDeviceNamePrompt("");
      if (!name) return false;
      deviceName = name;
      persistOrWarn(GLOBAL_KEYS.device, deviceName);
      renderStatus();
    }
    if (!scanLog.length) {
      await showConfirm({ title: "Nothing to export", message: "No scans recorded yet for this job.", confirmLabel: "OK", cancelLabel: "OK" });
      return false;
    }
    return true;
  }

  function buildExportFile() {
    const csv = scansToCsv(scanLog.slice().reverse());   // chronological order in the file
    // The active job's id in the filename is what a desktop-side
    // merge_scans.py --job-id check (soft, non-blocking) compares against -
    // keep stamping whichever job was active when Export/Share was tapped.
    const filename = `scans_${activeJobId}_${deviceName}_${melbourneDateOnly()}.csv`;
    return { csv, filename };
  }

  // Single owner of the Clear log button's enabled state + tooltip, so the
  // "why is this greyed out" wording can't drift between the enable and the
  // disable path (it's also called once at Init and on every job switch to
  // set the initial state).
  function setClearLogEnabled(enabled) {
    const btn = document.getElementById("clearLogBtn");
    if (!btn) return;
    btn.disabled = !enabled;
    btn.title = enabled ? "Clear all scans for this job" : "Export at least once this session to enable";
  }

  function markExported() {
    exportedThisSession = true;
    setClearLogEnabled(true);
  }

  async function doExport() {
    if (!(await ensureReadyToExport())) return;
    const { csv, filename } = buildExportFile();
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    showToast(`Exported ${scanLog.length} scans to ${filename}.`);
    markExported();
  }

  // Additive alongside the plain download above, never instead of it - only
  // shown when the browser can actually share a File (desktop Chrome and
  // some Android WebViews can't), so the manual download path always stays
  // available as a fallback.
  async function doShare() {
    if (!(await ensureReadyToExport())) return;
    const { csv, filename } = buildExportFile();
    const file = new File([csv], filename, { type: "text/csv" });
    try {
      await navigator.share({ files: [file], title: filename });
      markExported();
    } catch (e) {
      if (e && e.name !== "AbortError") {   // AbortError = user cancelled the share sheet, not a real failure
        await showConfirm({
          title: "Share failed",
          message: (e && e.message ? e.message : String(e)) + " — you can still use Export CSV instead.",
          confirmLabel: "OK", cancelLabel: "OK",
        });
      }
    }
  }

  // ===========================================================================
  //  Wiring
  // ===========================================================================
  function setMode(m) {
    mode = m;
    document.querySelectorAll(".mode-btn").forEach((b) => b.classList.toggle("active", b.dataset.mode === m));
    document.body.classList.toggle("mode-delivery", m === "DELIVERY");
    document.body.classList.toggle("mode-install", m === "INSTALL");
    persistOrWarn(JK.mode, m);
  }
  document.querySelectorAll(".mode-btn").forEach((btn) => {
    btn.addEventListener("click", () => setMode(btn.dataset.mode));
  });

  document.getElementById("jobSelect").addEventListener("change", (ev) => {
    if (processing) { renderJobSelect(); return; }   // revert - can't switch mid decode-confirm
    switchJob(ev.target.value);
  });
  document.getElementById("addJobBtn").addEventListener("click", async () => {
    if (processing) return;   // don't open a second modal over an in-flight decode-confirm
    const created = await showAddJobPrompt();
    if (!created) return;
    jobs = jobs.concat([created]);
    persistOrWarn(GLOBAL_KEYS.jobs, jobs);
    switchJob(created.id);
  });

  document.getElementById("loadRegisterBtn").addEventListener("click", () => {
    document.getElementById("csvFileInput").click();
  });
  document.getElementById("csvFileInput").addEventListener("change", async (ev) => {
    const file = ev.target.files[0];
    ev.target.value = "";
    if (!file) return;
    // Gated by `processing` like every other modal in this file: this path now
    // always ends in a modal (it used to only on the rare error), so without
    // this a decode arriving mid-dialog would overwrite the card and orphan
    // the await below.
    processing = true;
    try {
      const text = await file.text();
      const { count, duplicates } = loadRegisterFromCsvText(text);
      const dupNote = duplicates
        ? ` — ${duplicates} duplicate TagID${duplicates === 1 ? "" : "s"} found, only the first row of each was kept.`
        : "";
      await showConfirm({
        title: "Register loaded",
        message: `Loaded ${count} item${count === 1 ? "" : "s"}.${dupNote}`,
        confirmLabel: "OK", cancelLabel: "OK",
      });
    } catch (e) {
      await showConfirm({ title: "Couldn't load CSV", message: String(e.message || e), confirmLabel: "OK", cancelLabel: "OK" });
    } finally {
      processing = false;
    }
  });

  document.getElementById("setDeviceBtn").addEventListener("click", async () => {
    const name = await showDeviceNamePrompt(deviceName || "");
    if (name) { deviceName = name; persistOrWarn(GLOBAL_KEYS.device, deviceName); renderStatus(); }
  });

  document.getElementById("speakToggle").addEventListener("change", (ev) => {
    speakEnabled = ev.target.checked;
    persistOrWarn(GLOBAL_KEYS.speak, speakEnabled);
  });

  document.getElementById("themeToggleBtn").addEventListener("click", toggleTheme);
  document.getElementById("helpBtn").addEventListener("click", showHelp);

  document.getElementById("persistBannerClose").addEventListener("click", () => {
    document.getElementById("persistBanner").hidden = true;
  });
  document.getElementById("onboardBannerClose").addEventListener("click", markOnboarded);

  document.getElementById("clearLogBtn").addEventListener("click", async () => {
    if (!exportedThisSession) return;   // belt-and-suspenders - the button is also `disabled` until this is true
    const ok = await showTypedConfirm({
      title: "Clear log",
      message: "This permanently deletes every scan recorded for this job. You've already exported this session, so that data is safely in the CSV - but this cannot be undone here.",
      confirmWord: "YES",
      confirmLabel: "Clear log",
      cancelLabel: "Keep scans",
    });
    if (!ok) return;
    clearScanLog();
    exportedThisSession = false;
    setClearLogEnabled(false);
  });

  document.getElementById("exportBtn").addEventListener("click", doExport);
  document.getElementById("shareBtn").addEventListener("click", doShare);

  // ===========================================================================
  //  Init
  // ===========================================================================
  renderJobSelect();
  updateDocumentTitle();
  document.getElementById("speakToggle").checked = !!speakEnabled;
  applyTheme(theme);
  setClearLogEnabled(exportedThisSession);
  renderStatus();
  renderCounts();
  renderScanList();
  sizeScanFrame();
  startCamera();

  if (!lsGet(GLOBAL_KEYS.onboarded, false)) {
    document.getElementById("onboardBanner").hidden = false;
  }

  // Feature-detect the Web Share API for files. canShare() needs an actual
  // File to test against - a throwaway one is fine, nothing is shared here.
  (function checkShareSupport() {
    let supported = false;
    try {
      if (navigator.canShare && navigator.share) {
        const probe = new File(["x"], "probe.csv", { type: "text/csv" });
        supported = navigator.canShare({ files: [probe] });
      }
    } catch (e) { supported = false; }
    document.getElementById("shareBtn").hidden = !supported;
  })();

  // First open on a phone that's never used this page before: try to load
  // trial_items.csv automatically from right next to index.html, so there's
  // nothing to pick or hunt for - the register is just there. Only for the
  // bootstrap job: a freshly-created job has no bundled register to auto-
  // load, so it stays "none loaded" until someone uses "Load register CSV".
  // Silent no-op if the file is missing (e.g. hosted without it) or
  // unreachable (offline before the first successful load) either way - the
  // manual button is always there as a fallback. (Deliberately silent even
  // about duplicate TagIDs here - the manual load path is where that gets
  // surfaced, since interrupting an automatic zero-tap bootstrap would
  // defeat the point of it.)
  if (!register && activeJobId === BOOTSTRAP_JOB_ID && "fetch" in window) {
    const fetchJobId = activeJobId;   // captured now - see the check below
    fetch("trial_items.csv").then((r) => {
      if (!r.ok) throw new Error("no trial_items.csv alongside index.html");
      return r.text();
    }).then((text) => {
      // This fetch has no `processing` gate (it's meant to be silent/non-
      // blocking), so a job switch can finish before it resolves - without
      // this check, a bootstrap-job register fetched slowly (or while
      // offline, then retried) would land in whichever job is active by the
      // time it comes back, not the one it was fetched for.
      if (activeJobId !== fetchJobId) return;
      loadRegisterFromCsvText(text);
    }).catch((e) => console.warn("Auto-load of trial_items.csv skipped:", e.message || e));
  }

  // Both startup prompts share one modal card, so they must run one after the
  // other - firing them in the same tick would let the second overwrite the
  // first's markup and leave the first's promise permanently unsettled (in
  // practice: the device-name prompt flashing up and vanishing unanswered).
  // Still non-blocking overall: the camera starts regardless, above.
  (async function runStartupPrompts() {
    // Ask for the device name up front so real scans get tagged correctly from
    // the first one, rather than only being asked the first time someone taps
    // Export.
    if (!deviceName) {
      const name = await showDeviceNamePrompt("");
      if (name) { deviceName = name; persistOrWarn(GLOBAL_KEYS.device, deviceName); renderStatus(); }
    }

    // Mode is deliberately NOT auto-resumed silently - a returning visitor
    // whose last mode was INSTALL gets asked to confirm before any scan can be
    // logged, so it stays a visible, deliberate choice rather than inferred
    // state (this preserves the intent behind the original "always reset to
    // DELIVERY" design, just letting the user pick up where they left off
    // instead of always forcing DELIVERY). Gated by `processing` for the same
    // reason as every other modal here - so a decode that arrives while this
    // prompt is open is safely ignored rather than colliding with it. (This
    // only runs once, for the job active at page load - switching jobs later
    // applies that job's last mode without re-prompting, see switchJob().)
    const persistedMode = lsGet(JK.mode, null);
    if ((persistedMode === "DELIVERY" || persistedMode === "INSTALL") && persistedMode !== mode) {
      const other = persistedMode === "DELIVERY" ? "INSTALL" : "DELIVERY";
      processing = true;
      try {
        const keep = await showConfirm({
          title: "Resume previous mode?",
          message: `This phone was last left in ${persistedMode} mode. Continue in ${persistedMode}, or switch to ${other}?`,
          confirmLabel: `Continue in ${persistedMode}`,
          cancelLabel: `Switch to ${other}`,
        });
        setMode(keep ? persistedMode : other);
      } finally {
        processing = false;
      }
    }
  })();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch((e) => console.warn("SW registration failed", e));
  }
})();
</script>
</body>
</html>
